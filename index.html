<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能巴士客運</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #38bfa1;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text-main: #333333;
            --text-muted: #999999;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            padding-bottom: 70px;
        }

        /* Toast 提示框樣式 */
        .toast-msg {
            position: fixed; top: -50px; left: 50%; transform: translateX(-50%);
            background: rgba(50, 50, 50, 0.9); color: white; padding: 12px 24px; border-radius: 25px;
            font-size: 14px; z-index: 9999; transition: top 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            white-space: nowrap; pointer-events: none;
        }
        .toast-msg.show { top: 20px; }

        .top-banner {
            background: linear-gradient(135deg, #38bfa1, #2cb092);
            height: 160px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            padding: 20px;
            color: white;
            box-sizing: border-box;
            text-align: center;
        }
        .top-banner h1 { margin: 10px 0 0 0; font-size: 20px; font-weight: normal; }

        .card-panel {
            background: var(--card);
            margin: -70px 15px 15px 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            position: relative;
        }

        /* 登入/註冊區塊 */
        .auth-container { padding: 20px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: bold; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; 
        }
        
        /* 購票區塊 */
        .trip-type-switch { display: flex; justify-content: center; background: #f1f5f9; border-radius: 25px; padding: 4px; margin: 0 auto 20px auto; width: 200px; }
        .trip-type-btn { flex: 1; text-align: center; padding: 8px 0; border-radius: 20px; font-size: 14px; color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .trip-type-btn.active { background: var(--primary); color: white; font-weight: bold; box-shadow: 0 2px 5px rgba(56, 191, 161, 0.3); }

        .route-display {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .route-display-item { display: flex; flex-direction: column; align-items: center; }
        .route-display-item span.label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .route-display-item span.city { font-size: 22px; font-weight: bold; color: var(--primary); }
        .route-arrow { margin: 15px 0; color: #cbd5e1; font-size: 20px; }

        .date-selector { margin-bottom: 20px; }
        .date-selector input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; font-weight: bold; color: var(--text-main); background: #f8fafc; text-align: center; }

        .primary-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(56, 191, 161, 0.3); }
        .secondary-btn { width: 100%; background: white; color: var(--text-main); border: 1px solid #ddd; padding: 15px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* 結果與車票 */
        #resultsArea { padding: 0 15px; margin-top: 20px; }
        .schedule-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .time-loc .time { font-size: 20px; font-weight: bold; color: var(--text-main); display: block; }
        .time-loc .route { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: block; }
        .price-box { text-align: right; }
        .price-box .price { font-size: 20px; font-weight: bold; color: #ff5722; margin-bottom: 5px; }
        .buy-btn { background: #ff5722; color: white; border: none; padding: 6px 16px; border-radius: 15px; font-size: 13px; cursor: pointer; }

        #ticketArea { text-align: center; padding: 20px; animation: fadeIn 0.4s; }
        .ticket-box { background: white; border-radius: 16px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: -60px; position: relative; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
        .ticket-info { text-align: left; background: #f8fafc; padding: 15px; border-radius: 10px; font-size: 14px; line-height: 1.8; color: #475569; }

        /* 用戶中心 */
        .profile-header { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #eee; }
        .avatar { width: 60px; height: 60px; background: #e2e8f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #94a3b8; margin-right: 15px; }
        .profile-info h2 { margin: 0; font-size: 18px; }
        .profile-info p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }

        /* 導航 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; z-index: 10; max-width: 480px; margin: 0 auto; }
        .nav-item { text-align: center; font-size: 11px; color: #94a3b8; text-decoration: none; cursor: pointer; width: 33%; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 視圖控制 */
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>
    <!-- Toast 提示組件 -->
    <div id="toastBox" class="toast-msg"></div>

    <div class="app-container">
        <!-- 頂部背景 (公用) -->
        <div class="top-banner" id="mainHeader">
            <h1 id="headerTitle">🚍 智能巴士客運</h1>
        </div>

        <!-- ================= 視圖 1: 登入與註冊 ================= -->
        <div id="authView" class="view-section">
            <div class="card-panel auth-container">
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登入</div>
                    <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">註冊</div>
                </div>

                <!-- 登入表單 -->
                <div id="loginForm">
                    <div class="form-group">
                        <label>電話號碼</label>
                        <input type="tel" id="loginPhone" placeholder="請輸入註冊手機號碼">
                    </div>
                    <div class="form-group">
                        <label>密碼</label>
                        <input type="password" id="loginPwd" placeholder="請輸入6位字母或數字">
                    </div>
                    <button class="primary-btn" onclick="handleLogin()">登入</button>
                </div>

                <!-- 註冊表單 -->
                <div id="registerForm" style="display:none;">
                    <div class="form-group">
                        <label>電話號碼</label>
                        <input type="tel" id="regPhone" placeholder="例如: 98765432">
                    </div>
                    <!-- 修正：將旅遊證件名稱改為真實姓名 -->
                    <div class="form-group">
                        <label>真實姓名 (需與證件相同)</label>
                        <input type="text" id="regDocName" placeholder="如: 陳大文 / Chan Tai Man">
                    </div>
                    <div class="form-group">
                        <label>出生日期</label>
                        <input type="date" id="regDob">
                    </div>
                    <div class="form-group">
                        <label>性別</label>
                        <select id="regGender">
                            <option value="">請選擇</option>
                            <option value="M">男</option>
                            <option value="F">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>設定密碼 (必須剛好 6 個字，僅限英文字母或數字)</label>
                        <input type="password" id="regPwd" placeholder="例如: AB12cd" maxlength="6">
                        <small style="color:red; display:none;" id="pwdError">密碼格式錯誤</small>
                    </div>
                    <button class="primary-btn" onclick="handleRegister()">註冊並登入</button>
                </div>
            </div>
        </div>

        <!-- ================= 視圖 2: 購票首頁 ================= -->
        <div id="bookingView" class="view-section">
            <div class="card-panel">
                <input type="hidden" id="ticketTypeValue" value="oneway">

                <div class="trip-type-switch">
                    <div class="trip-type-btn active" id="btnOneWay" onclick="setTripType('oneway')">單程</div>
                    <div class="trip-type-btn" id="btnRound" onclick="setTripType('round')">往返 <span style="font-size:10px; background:#ff4d4f; color:white; padding:2px 4px; border-radius:8px;">惠</span></div>
                </div>

                <!-- 系統固定顯示，不可手動修改 -->
                <div class="route-display">
                    <div class="route-display-item">
                        <span class="label">系統分配出發地</span>
                        <span class="city" id="displayOrigin">旺角</span>
                    </div>
                    <div class="route-arrow">
                        <i class="fas fa-long-arrow-alt-down"></i>
                    </div>
                    <div class="route-display-item">
                        <span class="label">系統分配目的地</span>
                        <!-- 修正：與 JS 設定的終點統一為尖沙咀 -->
                        <span class="city" id="displayDest">尖沙咀</span>
                    </div>
                </div>

                <div class="date-selector">
                    <input type="date" id="searchDate">
                </div>

                <button class="primary-btn" onclick="window.searchSchedules()">搜索此路線班次</button>
            </div>

            <div id="resultsArea"></div>
        </div>

        <!-- ================= 視圖 3: 車票詳情 ================= -->
        <div id="ticketView" class="view-section">
            <div class="ticket-box">
                <h2 style="color:var(--primary); margin-top:0;">購票成功</h2>
                <p style="color:var(--text-muted); font-size:13px;">請於上車時向司機出示此二維碼</p>
                <div id="qrcode"></div>
                <div class="ticket-info" id="ticketDetails"></div>
                <button class="secondary-btn" onclick="switchView('booking')">返回購票</button>
            </div>
        </div>

        <!-- ================= 視圖 4: 用戶中心 (我的) ================= -->
        <div id="profileView" class="view-section">
            <div class="card-panel" style="padding: 0; overflow: hidden;">
                <div class="profile-header">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div class="profile-info">
                        <h2 id="profilePhone">未登入</h2>
                        <p id="profileDoc">請先登入或註冊</p>
                    </div>
                </div>
                <div style="padding: 20px;">
                    <div style="margin-bottom:20px; font-size:14px; color:#666;">
                        <p><strong>出生日期：</strong> <span id="profileDob">-</span></p>
                        <p><strong>性別：</strong> <span id="profileGender">-</span></p>
                    </div>
                    <button class="secondary-btn" style="color:#ef4444; border-color:#ef4444;" onclick="handleLogout()">登出帳號</button>
                </div>
            </div>
        </div>

        <!-- 底部導航欄 -->
        <div class="bottom-nav" id="bottomNav" style="display:none;">
            <div class="nav-item" id="navBooking" onclick="switchView('booking')"><i class="fas fa-bus"></i>購票</div>
            <div class="nav-item" id="navProfile" onclick="switchView('profile')"><i class="fas fa-user"></i>我的</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCq_8FSy5JU9-ETd1F3whQHwXC_fY1uqdo",
            authDomain: "admin-bus2026.firebaseapp.com",
            databaseURL: "https://admin-bus2026-default-rtdb.firebaseio.com",
            projectId: "admin-bus2026",
            storageBucket: "admin-bus2026.firebasestorage.app",
            messagingSenderId: "465878874061",
            appId: "1:465878874061:web:f967bd130caf9546abb684"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 系統分配的地點
        const SYSTEM_ORIGIN = "旺角"; 
        const SYSTEM_DEST = "尖沙咀";

        // Toast 提示函數
        function showToast(message) {
            const toast = document.getElementById('toastBox');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 啟動初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchDate').valueAsDate = new Date();
            document.getElementById('displayOrigin').textContent = SYSTEM_ORIGIN;
            document.getElementById('displayDest').textContent = SYSTEM_DEST;
            checkLoginStatus();
        });

        function isValidPassword(pwd) {
            const regex = /^[A-Za-z0-9]{6}$/;
            return regex.test(pwd);
        }

        // ================= 帳號與視圖邏輯 =================
        window.switchAuthTab = function(tab) {
            if(tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            }
        }

        window.switchView = function(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(viewName === 'auth') {
                document.getElementById('authView').classList.add('active');
                document.getElementById('headerTitle').textContent = "用戶登入/註冊";
                document.getElementById('bottomNav').style.display = 'none';
            } else if(viewName === 'booking') {
                document.getElementById('bookingView').classList.add('active');
                document.getElementById('navBooking').classList.add('active');
                document.getElementById('headerTitle').textContent = "🚍 智能巴士客運";
                document.getElementById('bottomNav').style.display = 'flex';
                document.getElementById('resultsArea').innerHTML = '';
            } else if(viewName === 'profile') {
                document.getElementById('profileView').classList.add('active');
                document.getElementById('navProfile').classList.add('active');
                document.getElementById('headerTitle').textContent = "會員中心";
                document.getElementById('bottomNav').style.display = 'flex';
                loadProfileData();
            } else if(viewName === 'ticket') {
                document.getElementById('ticketView').classList.add('active');
                document.getElementById('headerTitle').textContent = "電子車票";
                document.getElementById('bottomNav').style.display = 'none';
            }
        }

        function checkLoginStatus() {
            const currentUser = localStorage.getItem('busCurrentUser');
            if (currentUser) {
                switchView('booking');
            } else {
                switchView('auth');
            }
        }

        // 註冊
        window.handleRegister = function() {
            const phone = document.getElementById('regPhone').value.trim();
            const docName = document.getElementById('regDocName').value.trim();
            const dob = document.getElementById('regDob').value;
            const gender = document.getElementById('regGender').value;
            const pwd = document.getElementById('regPwd').value;
            const errorLabel = document.getElementById('pwdError');

            if(!phone || !docName || !dob || !gender || !pwd) {
                showToast("請填寫所有註冊資料"); return;
            }

            if(!isValidPassword(pwd)) {
                errorLabel.style.display = 'block';
                return;
            }
            errorLabel.style.display = 'none';

            const userData = { phone, docName, dob, gender, pwd };
            set(ref(db, 'users/' + phone), userData).then(() => {
                showToast("註冊成功！");
                // 安全優化：剔除密碼後存入 localStorage
                const safeData = { phone, docName, dob, gender };
                localStorage.setItem('busCurrentUser', JSON.stringify(safeData));
                switchView('booking');
            }).catch(e => showToast("註冊失敗: " + e.message));
        };

        // 登入
        window.handleLogin = function() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pwd = document.getElementById('loginPwd').value;

            if(!phone || !pwd) { showToast("請輸入電話和密碼"); return; }

            get(ref(db, 'users/' + phone)).then((snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.pwd === pwd) {
                        // 安全優化：剔除密碼後存入 localStorage
                        const safeData = { phone: userData.phone, docName: userData.docName, dob: userData.dob, gender: userData.gender };
                        localStorage.setItem('busCurrentUser', JSON.stringify(safeData));
                        switchView('booking');
                    } else {
                        showToast("密碼錯誤");
                    }
                } else {
                    showToast("找不到此電話號碼，請先註冊");
                }
            });
        };

        // 登出
        window.handleLogout = function() {
            localStorage.removeItem('busCurrentUser');
            switchView('auth');
            document.getElementById('loginPhone').value = '';
            document.getElementById('loginPwd').value = '';
        }

        // 載入用戶資料
        function loadProfileData() {
            const userStr = localStorage.getItem('busCurrentUser');
            if(userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('profilePhone').textContent = "📞 " + user.phone;
                document.getElementById('profileDoc').textContent = "姓名: " + user.docName;
                document.getElementById('profileDob').textContent = user.dob;
                document.getElementById('profileGender').textContent = (user.gender === 'M') ? "男" : "女";
            }
        }


        // ================= 購票邏輯 =================
        window.setTripType = function(type) {
            document.getElementById('ticketTypeValue').value = type;
            if(type === 'oneway') {
                document.getElementById('btnOneWay').classList.add('active');
                document.getElementById('btnRound').classList.remove('active');
            } else {
                document.getElementById('btnRound').classList.add('active');
                document.getElementById('btnOneWay').classList.remove('active');
            }
        }

        window.searchSchedules = function() {
            const date = document.getElementById('searchDate').value;
            const resultsArea = document.getElementById('resultsArea');
            
            if(!date) { showToast("請選擇日期"); return; }
            resultsArea.innerHTML = "<p style='text-align:center; color:#999;'><i class='fas fa-spinner fa-spin'></i> 正在搜尋...</p>";

            get(ref(db, 'schedules')).then((snapshot) => {
                resultsArea.innerHTML = "";
                let found = false;
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const sch = child.val();
                        if (sch.date === date && sch.origin.includes(SYSTEM_ORIGIN) && sch.destination.includes(SYSTEM_DEST)) {
                            found = true;
                            renderCard(sch);
                        }
                    });
                }
                if (!found) resultsArea.innerHTML = "<p style='text-align:center; color:#ff5722;'>此路線該日暫無班次</p>";
            });
        };

        function renderCard(sch) {
            const type = document.getElementById('ticketTypeValue').value;
            const isRound = type === 'round';
            const finalPrice = isRound ? sch.price * 2 : sch.price; 
            
            const div = document.createElement('div');
            div.className = 'schedule-card';
            div.innerHTML = `
                <div class="time-loc">
                    <span class="time">${sch.time}</span>
                    <span class="route">${sch.origin} <i class="fas fa-arrow-right"></i> ${sch.destination}</span>
                    <span style="font-size:11px; color:var(--primary); font-weight:bold;">
                        ${isRound ? '🔄 往返' : '單程'}
                    </span>
                </div>
                <div class="price-box">
                    <div class="price">HK$${finalPrice}</div>
                    <button class="buy-btn" onclick="window.buyTicket('${sch.id}', '${sch.origin}', '${sch.destination}', '${sch.time}', '${type}')">預訂</button>
                </div>
            `;
            document.getElementById('resultsArea').appendChild(div);
        }

        window.buyTicket = function(schId, origin, dest, time, type) {
            const isRound = type === 'round';
            // 加入時間戳確保票號唯一
            const ticketId = 'TKT-' + Date.now().toString().slice(-4) + Math.floor(10 + Math.random() * 90);
            const user = JSON.parse(localStorage.getItem('busCurrentUser'));
            
            const ticketData = {
                id: ticketId,
                scheduleId: schId,
                type: type,
                scansLeft: isRound ? 2 : 1,
                purchasedAt: Date.now(),
                ownerPhone: user.phone
            };

            set(ref(db, 'tickets/' + ticketId), ticketData).then(() => {
                switchView('ticket');
                
                const typeText = isRound ? "🔄 往返 (可掃 2 次)" : "單程 (可掃 1 次)";
                document.getElementById('ticketDetails').innerHTML = `
                    <strong>乘客電話：</strong>${user.phone}<br>
                    <strong>訂單編號：</strong>${ticketId}<br>
                    <strong>車票類型：</strong>${typeText}<br>
                    <strong>乘車路線：</strong>${origin} <i class="fas fa-arrow-right"></i> ${dest}<br>
                    <strong>發車時間：</strong>${time}
                `;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: ticketId,
                    width: 200, height: 200,
                    colorDark : "#333333", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
                });
            }).catch(e => showToast("購票失敗：" + e.message));
        };
    </script>
</body>
</html>
